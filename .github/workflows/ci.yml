name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'

      - name: Update package index
        run: cabal update

      - name: Build SDK and demos
        run: cabal build all

      - name: Compile pure benchmark
        run: cabal exec -- ghc -idemo -isdk -fno-code demo/RequestBenchmark/Main.hs
